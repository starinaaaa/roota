<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>Roota · чеки НПД</title><link rel="stylesheet" href="popup.css">
<body>
<h1>Чеки маркета</h1>
<p id="error" role="alert" tabindex="-1"></p>
<p id="status" role="status">Загружаем состояние…</p>
<p id="task" class="small"></p>
<p><a id="found-receipt" hidden target="_blank" rel="noreferrer">Открыть найденный чек ФНС</a></p>
<button id="recover">Сверить результат с Roota</button>
<button id="arm">Включить автоматическую выдачу</button>
<button id="pause">Приостановить выдачу</button>
<details id="connection"><summary>Подключение к кассе</summary>
<p class="small">ID расширения <code id="extension-id"></code></p>
<label>Ключ из кассы Roota<input id="credential" type="password" autocomplete="off" spellcheck="false"></label>
<button id="connect">Подключить</button><button id="disconnect">Отключить локально</button></details>
<details><summary>Проверка без выдачи чека</summary>
<label>Какие продажи проверять<select id="sales-mode"><option value="test">Тестовые продажи</option><option value="live">Рабочие продажи</option></select></label>
<button id="preview">Заполнить форму без выдачи</button>
<button id="inspect">Проверить открытый чек без выдачи</button><p id="inspection" role="status"></p>
<label><input id="draft-closed" type="checkbox">Я закрыл(а) черновик ФНС без выдачи чека</label>
<button id="clear">Закрыть проверку</button></details>
<script type="module" src="popup.mjs"></script></body></html>
